<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YazFit — Personal Training & Nutrition Coach</title>
<meta name="description" content="Personalized workout and nutrition plans built on WHO, ACSM, ISSN and CDC standards. US lifestyle ready.">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YazFit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

<!-- ===== App shell ===== -->
<div id="app">
  <header class="topbar no-print">
    <div class="brand">
      <div class="logo">Y</div>
      <span>YazFit</span>
      <span id="subbadge" class="pill pro" style="display:none">PLUS</span>
    </div>
    <div class="actions">
      <button class="btn sm ghost" id="btn-theme" data-act="theme" aria-label="Toggle theme">🌗</button>
      <button class="btn sm accent" id="btn-pro" data-act="open-paywall">Go Pro</button>
    </div>
  </header>

  <div class="layout">
    <nav id="sidebar" class="no-print" aria-label="Main navigation">
      <button class="nav-item" data-act="nav" data-tab="today"><span class="ic">🏠</span>Today</button>
      <button class="nav-item" data-act="nav" data-tab="workouts"><span class="ic">🏋️</span>Workouts</button>
      <button class="nav-item" data-act="nav" data-tab="nutrition"><span class="ic">🥗</span>Nutrition</button>
      <button class="nav-item" data-act="nav" data-tab="progress"><span class="ic">📈</span>Progress</button>
      <button class="nav-item" data-act="nav" data-tab="profile"><span class="ic">⚙️</span>Profile</button>
      <div class="procard" id="sidepro"></div>
    </nav>

    <main id="main">
      <section id="view-today" class="view"></section>
      <section id="view-workouts" class="view" hidden></section>
      <section id="view-nutrition" class="view" hidden></section>
      <section id="view-progress" class="view" hidden></section>
      <section id="view-profile" class="view" hidden></section>
    </main>
  </div>

  <nav id="bottomnav" class="no-print" aria-label="Main navigation">
    <button class="nav-item" data-act="nav" data-tab="today"><span class="ic">🏠</span>Today</button>
    <button class="nav-item" data-act="nav" data-tab="workouts"><span class="ic">🏋️</span>Workouts</button>
    <button class="nav-item" data-act="nav" data-tab="nutrition"><span class="ic">🥗</span>Nutrition</button>
    <button class="nav-item" data-act="nav" data-tab="progress"><span class="ic">📈</span>Progress</button>
    <button class="nav-item" data-act="nav" data-tab="profile"><span class="ic">⚙️</span>Profile</button>
  </nav>
</div>

<!-- ===== Onboarding ===== -->
<div id="onboarding" role="dialog" aria-label="Setup wizard"></div>

<!-- ===== Modal & toast roots ===== -->
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app-views.js"></script>
<script src="app-core.js"></script>
</body>
</html>
